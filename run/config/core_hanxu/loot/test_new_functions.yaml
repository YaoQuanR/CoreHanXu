id: "test_new_functions"

pools:
  # ===== 1. set_exactly_damage =====
  - rolls: 1
    entries:
      - type: item
        id: "minecraft:diamond_sword"
        weight: 1
        functions:
          - function: set_exactly_damage
            damage: 5

  # ===== 2. set_fire_resistant =====
  - rolls: 1
    entries:
      - type: item
        id: "minecraft:leather_chestplate"
        weight: 1
        functions:
          - function: set_fire_resistant

  # ===== 3. set_potion =====
  - rolls: 1
    entries:
      - type: item
        id: "minecraft:potion"
        weight: 1
        functions:
          - function: set_potion
            id: "minecraft:swiftness"

  # ===== 4. set_attributes =====
  - rolls: 1
    entries:
      - type: item
        id: "minecraft:netherite_sword"
        weight: 1
        functions:
          - function: set_attributes
            attributes:
              - id: "minecraft:attack_damage"
                amount: 10
                slot: "mainhand"
              - id: "minecraft:attack_speed"
                amount: 2.0
                operation: "multiply_base"
                slot: "mainhand"

  # ===== 5. set_glint_override =====
  - rolls: 1
    entries:
      - type: item
        id: "minecraft:stick"
        weight: 1
        functions:
          - function: set_glint_override
            glint: true

  # ===== 6. set_repair_cost =====
  - rolls: 1
    entries:
      - type: item
        id: "minecraft:diamond_pickaxe"
        weight: 1
        functions:
          - function: set_repair_cost
            cost: 20

  # ===== 7. set_food =====
  - rolls: 1
    entries:
      - type: item
        id: "minecraft:rotten_flesh"
        weight: 1
        functions:
          - function: set_food
            food:
              nutrition: 8
              saturation: 0.8
              can_always_eat: true

  # ===== 8. unbreakable =====
  - rolls: 1
    entries:
      - type: item
        id: "minecraft:shield"
        weight: 1
        functions:
          - function: unbreakable

  # ===== 9. set_can_break =====
  - rolls: 1
    entries:
      - type: item
        id: "minecraft:diamond_pickaxe"
        weight: 1
        functions:
          - function: set_can_break
            blocks:
              - "minecraft:stone"
              - "minecraft:deepslate"

  # ===== 10. set_can_place_on =====
  - rolls: 1
    entries:
      - type: item
        id: "minecraft:dirt"
        weight: 1
        functions:
          - function: set_can_place_on
            blocks:
              - "minecraft:grass_block"
              - "minecraft:podzol"